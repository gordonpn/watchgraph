name: Java quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (application toolchain)
        id: setup-java-25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up JDK 21 (Gradle and Checkstyle)
        id: setup-java-21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Check Java sources and rule fixtures
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ steps.setup-java-21.outputs.path }}
        run: ./gradlew quality -Porg.gradle.java.installations.paths="${{ steps.setup-java-25.outputs.path }}"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-quality-reports
          path: build/reports/checkstyle/
          if-no-files-found: ignore
