name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent:
    name: runner / pr-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    env:
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check DeepSeek credentials and endpoint
        run: bash .github/scripts/check-reviewer-credentials.sh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: PR Agent Action
        uses: docker://pragent/pr-agent:github_action@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        env:
          CONFIG.MODEL: "deepseek/deepseek-v4-flash"
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-v4-pro"]'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: ${{ env.DEEPSEEK_BASE_URL }}
          GITHUB_ACTION_CONFIG.FAIL_ON_TOOL_ERRORS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
