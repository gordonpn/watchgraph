name: DeepSeek Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: runner / deepseek-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    env:
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check DeepSeek credentials and endpoint
        run: bash .github/scripts/check-reviewer-credentials.sh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Load DeepSeek review prompt
        id: prompt
        run: |
          {
            echo "prompt<<EOF_DEEPSEEK_PROMPT"
            cat .github/prompts/deepseek-review.md
            echo ""
            echo "EOF_DEEPSEEK_PROMPT"
          } >> "$GITHUB_OUTPUT"

      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@15a228bf15e01ef1f4d195eab4febbd7809dd2ed # v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
          base-url: ${{ env.DEEPSEEK_BASE_URL }}
          model: deepseek-chat
          sys-prompt: ${{ steps.prompt.outputs.prompt }}
