version: '3'

tasks:
  build:
    desc: Build the Spring Boot application jar
    cmds:
      - ./gradlew clean bootJar

  run:
    desc: Run the packaged CLI application
    cmds:
      - java -jar build/libs/anime-0.0.1-SNAPSHOT.jar

  start:
    desc: Build and run the CLI application
    cmds:
      - task: build
      - task: run

  test:
    desc: Run the unit and integration tests
    cmds:
      - ./gradlew test

  test-reviewers:
    desc: Verify the automated reviewer workflows and credential check
    cmds:
      - actionlint .github/workflows/deepseek-review.yml .github/workflows/pr-agent.yml
      - shellcheck .github/scripts/check-reviewer-credentials.sh .github/scripts/test-reviewer-preflight.sh .github/scripts/fixtures/reviewer-curl.sh
      - bash .github/scripts/test-reviewer-preflight.sh
