plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.3'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.gordonpn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = '0.8.13'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springShellVersion', "3.3.3")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.shell:spring-shell-starter'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.xerial:sqlite-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.5.3.Final'

    compileOnly 'org.projectlombok:lombok:1.18.46'

    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.shell:spring-shell-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.shell:spring-shell-dependencies:${springShellVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Run source analysis on the supported daemon JDK, independently of the Java 25 app.
def qualityLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    sourceSets = [project.sourceSets.main, project.sourceSets.test]
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    javaLauncher = qualityLauncher
    reports {
        xml.required = true
        html.required = true
    }
}

// The standalone CLI needs logging that Gradle's Ant-backed checks supply themselves.
configurations {
    qualityCliLogging
}

dependencies {
    qualityCliLogging 'commons-logging:commons-logging:1.4.0'
}

tasks.register('qualityRulesTest') {
    group = 'verification'
    description = 'Prove the shared Checkstyle rules accept clean code and reject each known violation.'
    inputs.files(fileTree('config/checkstyle'))
    inputs.files(configurations.checkstyle, configurations.qualityCliLogging)
    outputs.dir(layout.buildDirectory.dir('reports/checkstyle/fixtures'))
    doLast {
        def reportsDir = layout.buildDirectory.dir('reports/checkstyle/fixtures').get().asFile
        reportsDir.mkdirs()
        def expectedRules = [
            'Empty.java': 'EmptyStatementCheck',
            'Equality.java': 'EqualsHashCodeCheck',
            'Fallthrough.java': 'FallThroughCheck',
            'WrongName.java': 'OuterTypeFilenameCheck'
        ]
        ['clean', 'violations'].each { fixture ->
            def report = new File(reportsDir, "${fixture}.xml")
            report.delete() // Never accept a stale report if the CLI fails before writing one.
            def result = javaexec {
                executable = qualityLauncher.get().executablePath.asFile.absolutePath
                classpath = files(configurations.checkstyle, configurations.qualityCliLogging)
                mainClass = 'com.puppycrawl.tools.checkstyle.Main'
                args '-c', checkstyle.configFile.absolutePath, '-f', 'xml', '-o', report.absolutePath,
                        file("config/checkstyle/fixtures/${fixture}").absolutePath
                ignoreExitValue = true // Exit codes are the behavior under test, never ignored below.
            }
            def parsed = new XmlSlurper().parse(report)
            def errors = parsed.file.error
            if (fixture == 'clean') {
                if (result.exitValue != 0 || !errors.isEmpty()
                        || parsed.file.collect { new File(it.@name.text()).name } != ['Clean.java']) {
                    throw new GradleException('Clean Checkstyle fixture was rejected')
                }
            } else {
                def actualRules = parsed.file.collectEntries { checked ->
                    [(new File(checked.@name.text()).name): checked.error.collect {
                        it.@source.text().tokenize('.').last()
                    }]
                }
                def expected = expectedRules.collectEntries { name, rule -> [(name): [rule]] }
                if (result.exitValue != expectedRules.size() || actualRules != expected) {
                    throw new GradleException("Expected one rejection per enabled rule, got exit ${result.exitValue}: ${actualRules}")
                }
            }
        }
    }
}

tasks.register('quality') {
    group = 'verification'
    description = 'Run Java source checks and their positive/negative rule fixtures.'
    dependsOn 'checkstyleMain', 'checkstyleTest', 'qualityRulesTest'
}

tasks.named('check') {
    dependsOn 'qualityRulesTest'
}
